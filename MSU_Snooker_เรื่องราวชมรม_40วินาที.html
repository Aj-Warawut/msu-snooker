<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>แมตช์นี้มีแชมป์ ทุกแมตช์มีเพื่อน</title><style>body{margin:0;background:#102b24;color:#fff7df;font-family:Tahoma,sans-serif}main{max-width:1100px;margin:auto;padding:24px}h1{font-size:clamp(20px,3vw,32px)}p{line-height:1.7}.screen{aspect-ratio:16/9;background-image:url('09_สื่อและประชาสัมพันธ์/ชุดภาพการ์ตูนชมรม_7คน/08_เรื่องราวชมรม_8ฉาก.png');background-size:200% 400%;border-radius:16px;background-repeat:no-repeat}button{padding:12px 18px;border:0;border-radius:24px;background:#efc76a;color:#17382a;font:inherit;cursor:pointer;margin:4px}button:focus-visible,input:focus-visible{outline:3px solid white}input{width:100%;accent-color:#efc76a}.meta{color:#bad1c2;font-size:14px}#caption{min-height:2em;font-size:20px}details img{width:100%}nav{display:flex;flex-wrap:wrap}nav button{background:#28483e;color:white;font-size:14px}</style><main><p class="meta">MSU SNOOKER · ตัวอย่างลำดับเรื่อง 40 วินาที</p><h1>แมตช์นี้มีแชมป์ ทุกแมตช์มีเพื่อน</h1><div class="screen" id="screen" role="img"></div><p id="caption"></p><button id="play">▶ เล่นเรื่อง</button><button id="reset">↻ เริ่มใหม่</button><span id="time"></span><input id="seek" aria-label="เลื่อนเวลา" type="range" min="0" max="40" step="0.1" value="0"><nav id="scenes" aria-label="เลือกฉาก"></nav><p class="meta">เรื่องสมมติของสมาชิกทั้ง 7 คน เพื่อสื่อถึงมิตรภาพในชมรม ไม่ใช่บันทึกผู้เข้าร่วมการแข่งขันวันใดวันหนึ่ง<br>ฉบับนี้ใช้ภาพท่าหลักเพื่อตรวจจังหวะเรื่อง ยังไม่มีภาพเคลื่อนไหวแขนขาต่อเนื่อง</p><details><summary>ดูสตอรีบอร์ดทั้งหมด</summary><img loading="lazy" src="09_สื่อและประชาสัมพันธ์/ชุดภาพการ์ตูนชมรม_7คน/08_เรื่องราวชมรม_8ฉาก.png" alt="เรื่องราวทั้ง 8 ฉาก"></details></main><script>
const lines=['เพื่อนพร้อม โต๊ะพร้อม…เริ่มกันเลย','สันติจัดลูก วชิระเตรียมถุงมือ','ปรีชาส่งชอล์กให้พิษณุ ธนันชัยเตรียมคิว','นิ่งอีกนิด…เล็งให้ตรง','ลุ้นลูกแดงที่ปากหลุม','วราวุฒิกับอรรถพลส่งเสียงเชียร์','ช็อตดี ๆ มีเพื่อนร่วมยินดี','แมตช์นี้มีแชมป์ ทุกแมตช์มีเพื่อน'];
const screen=document.getElementById('screen'),caption=document.getElementById('caption'),seek=document.getElementById('seek'),play=document.getElementById('play');let t=0,running=false,last=0;
function draw(){const n=Math.min(7,Math.floor(t/5));screen.style.backgroundPosition=`${n%2*100}% ${Math.floor(n/2)*100/3}%`;screen.setAttribute('aria-label',lines[n]);caption.textContent=lines[n];seek.value=t;document.getElementById('time').textContent=t.toFixed(1)+' / 40 วินาที';play.textContent=running?'Ⅱ หยุดชั่วคราว':t>=40?'↻ เล่นอีกครั้ง':'▶ เล่นเรื่อง'}
lines.forEach((line,i)=>{const b=document.createElement('button');b.textContent='ฉาก '+(i+1);b.title=line;b.onclick=()=>{t=i*5;running=false;draw()};document.getElementById('scenes').append(b)});
play.onclick=()=>{if(t>=40)t=0;running=!running;draw()};document.getElementById('reset').onclick=()=>{t=0;running=false;draw()};seek.oninput=()=>{t=+seek.value;running=false;draw()};document.addEventListener('visibilitychange',()=>{if(document.hidden){running=false;draw()}});
function tick(now){if(running){t=Math.min(40,t+Math.min((now-last)/1000,.1));if(t>=40)running=false;draw()}last=now;requestAnimationFrame(tick)}draw();requestAnimationFrame(tick);
</script></html>
